<!DOCTYPE html>
<html>
<body>
<div id="container">
    <video id="localVideo" autoplay muted></video>
    <video id="remoteVideo" autoplay></video>

    <div class="box">
        <button id="answerButton">Answer</button>
        <button id="hangupButton">Hang Up</button>
    </div>

</div>
<script type="module">
import { initMomento, subscribeToMessages, publish, getKey, setKey, deleteKey, valueExists  } from './src/momento.js';
import { allThere, pieceTogether, sleep } from './src/utils.js';

initMomento();
subscribeToMessages('cache', 'agent:xyz:inbox', onEvent)

const answerButton = document.getElementById('answerButton');
const hangupButton = document.getElementById('hangupButton');
hangupButton.disabled = true;

const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

let pc;
let localStream;
let remoteStream;
let remoteCandidatesBuffer = [];
let remoteDescriptionSet = false;

answerButton.onclick = handleAnswerClick;
hangupButton.onclick = handleHangupClick;

async function handleAnswerClick() {

  // 1. Setup local stream and get user media
  localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
  localVideo.srcObject = localStream;

  // 2. Build call-accepted message and set it to visitor
  let message = createEventMessage('call-accepted');
  publish('cache','visitor:abc:inbox', message)

  // 3. Debounce so agent can't spam the answer button
  answerButton.disabled = true;
  hangupButton.disabled = false;
}

function createEventMessage(type){

  let from = 'xyz';
  let to = 'abc';

  // 0. Standard message structure
  let message = {
    from: from,
    to: to,
    type: type,
  }

  switch(type){
    case 'call-accepted':
      // no extra data needed
      return JSON.stringify(message);
      break;
  }

}

async function handleHangupClick() {

  hangupButton.disabled = true;
  answerButton.disabled = false;

  await hangup();
}

function setupRTC(){
  if (pc) {
    console.error('cannot create RTC connection if there is existing one');
    return;
  }
  console.log(`setting up RTC Peerconnection`);
  pc = new RTCPeerConnection();
  
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  // RTC Connection event handlers:
  // - Ice candidate event:
  pc.onicecandidate = e => {
    const message = {
      type: 'candidate',
      candidate: null,
    };
    if (e.candidate) {
      message.candidate = e.candidate.candidate;
      message.sdpMid = e.candidate.sdpMid;
      message.sdpMLineIndex = e.candidate.sdpMLineIndex;
    }
    publish('cache', 'visitor:abc:inbox', JSON.stringify(message));
  };
  // - Track event:
  pc.ontrack = (e) => {
    try { remoteVideo.srcObject = e.streams[0]; } 
    catch (error) { console.error('Error setting remote video source:', error); }
  }
}

// MAIN EVENT HANDLER
async function onEvent(e){

  // 0. we only care about the type, too much detail in the rest
  console.log(`incoming event: ${e.type}`);
  
  switch (e.type) {
    case 'offer': {
      // offers are tricky, sdp object is too large for momento message

      // PART 1: offer
      const { part, totalParts, sdpFragment, from } = e;
      // 1. Save the fragment in cache
      await setKey("cache", `${from}-${part}`, sdpFragment);
      // 2. Check if all parts are received
      const ready = await allThere(from, totalParts);
      // 3. If not all parts are received, wait for them
      if (!ready) {
        console.log(`Waiting for all parts to arrive...`);
        break;
      }
      // 4. Piece together the full SDP
      const fullSdp = await pieceTogether(from, totalParts);
      // 5. Set up peer connection
      await setupRTC();
      // 6. Set remote description with the full offer
      try {
        await pc.setRemoteDescription({ type: 'offer', sdp: fullSdp });
        console.log("Remote description set successfully.");
      } catch (err) {
        console.error("Failed to set remote description:", err);
        break;
      }

      // PART 2: answer
      // 1. Create an answer
      let answer;
      try {
        answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        console.log("Local description set with answer.");
      } catch (err) {
        console.error("Failed to create or set local description:", err);
        break;
      }

      // 2. Split answer SDP into two parts
      const midpoint = Math.ceil(answer.sdp.length / 2);
      const part1 = answer.sdp.slice(0, midpoint);
      const part2 = answer.sdp.slice(midpoint);

      const sdpAnswerPart1 = {
        from: 'xyz', // TODO: make dynamic
        type: "answer",
        part: "1",
        totalParts: "2",
        sdpFragment: part1,
      };
      const sdpAnswerPart2 = {
        from: 'xyz',
        type: "answer",
        part: "2",
        totalParts: "2",
        sdpFragment: part2,
      };

      // 3. Send answer parts to visitor
      await publish('cache', 'visitor:abc:inbox', JSON.stringify(sdpAnswerPart1));
      await sleep(500); // optional: lower delay for speed
      await publish('cache', 'visitor:abc:inbox', JSON.stringify(sdpAnswerPart2));

      // 4. Handle any buffered ICE candidates
      remoteDescriptionSet = true;
      remoteCandidatesBuffer.forEach(candidate => {
        pc.addIceCandidate(new RTCIceCandidate(candidate))
          .catch(e => console.error("Error adding ICE candidate from buffer:", e));
      });
      remoteCandidatesBuffer = [];
      break;
    }

    case 'answer':
      handleAnswer(e);
      break;
    case 'candidate':
      handleRemoteIceCandidate(e);
      break;
    case 'call':
      // A visitor is calling
      console.log('Visitor is calling');
      break;
    case 'ready':
      // A second tab joined. This tab will initiate a call unless in a call already.
      if (pc) {
        console.log('already in call, ignoring');
        return;
      }
      makeCall();
      break;
    case 'bye':
      if (pc) {
        hangup();
      }
      break;
    default:
      console.log('unhandled', e);
      break;
  }
}

async function hangup() {
  if (pc) {
    pc.close();
    pc = null;
  }
  localStream.getTracks().forEach(track => track.stop());
  localStream = null;
  startButton.disabled = false;
  hangupButton.disabled = true;
};

function handleRemoteIceCandidate(candidate) {
  if (remoteDescriptionSet) {
    pc.addIceCandidate(new RTCIceCandidate(candidate))
      .catch(e => console.error("Error adding ICE candidate:", e));
  } else {
    remoteCandidatesBuffer.push(candidate);
  }
}

</script>
</body>
</html>
