<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
    <title>ividiyo agents</title>
    <link rel="icon" type="image/png" href="/facepop-agents/favicon.svg">
  <script type="module" crossorigin src="/facepop-agents/assets/index-SlY-VgVd.js"></script>
  <link rel="stylesheet" crossorigin href="/facepop-agents/assets/index-DRGQH_A9.css">
</head>
<body>
<div class="header-bar"> 
  <div class="visitor-card"> 
    <label class="visitor-label">Live Site Visitors 👁️</label>
    <label class="eye">:</label>
    <label class="visitor-number">10</label>
  </div>
  <div class="online-card">
  <div>
    <label class="switch">
      <input type="checkbox" id="onlineToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="online-label"> I am online</div>
</div>
</div>
<br>

<div class="main-content">
  <div class="instructions-section">
    <button id="toggleInstructionsBtn">How to use</button>
    <textarea id="instructionsBox" style="display: none;" rows="10" cols="80" readonly>
  Welcome to ividiyo Agent Panel!
  1. install the ividiyo package from npm
  2. copy all of the files in the src folder to your project
  3. copy the index.html file to your project
  4. link the index.html to your style.css file
  5. set the config.js file with following:
  export const agentId =any unique id;
  export const api='https://momento-vendor-564404908477.europe-west1.run.app';
  export const cacheName='test'
  6. Toggle "I am online" to become available for incoming calls.
  7. Use the Agent ID input to set your unique agent identifier.
  8. Wait for a call to appear, then click "Answer".
  9. To end the call, click "Hang Up".
  
  Tip: Ensure camera and microphone access is allowed in your browser.
    </textarea>
  </div>
<div class="agent-details">
  <div class="agent-card">
    <label class="agent-label">ID:</label>
    <input type="text" class="agent-id" id="agentIdInput" value="1234567890" />
    <button class="id-set" id="setAgentIdBtn">Set</button>
  </div>
</div>
<div id="container">
  <div class="status-card">
    <div class="status"></div>
  </div>
  </div>
  <div>
    <video id="localVideo" class="local-video" autoplay muted></video>
    <video id="remoteVideo" class="remote-video" autoplay></video>

   
  </div>
  <div class="box">
    <button id="answerButton">Answer</button>
    <button id="hangupButton">Hang Up</button>
</div>
</div>
<script>
  const toggleBtn = document.getElementById("toggleInstructionsBtn");
const instructionsBox = document.getElementById("instructionsBox");

toggleBtn.addEventListener("click", () => {
  const isVisible = instructionsBox.style.display === "block";
  instructionsBox.style.display = isVisible ? "none" : "block";
  toggleBtn.textContent = isVisible ? "How" : "Hide Instructions";
});

</script>
</body>
</html>
